# Public demo on one AWS EC2 server. Layered on top of the normal files:
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml -f docker-compose.aws.yml up --build -d
#
# Safe by design for a server on the internet:
# - only Caddy is published (ports 80 and 443, HTTPS with a free certificate); the website, backend, mock, Redis
#   and Postgres are reachable only inside Docker
# - demo data only: MOCK_MODE=true, Swiggy sign-in routes switched off, real orders off
# Needs Docker Compose 2.24.4+ for `!reset` and `!override` (the setup script installs a current version).
services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]   # 80 is needed for the certificate check and redirects to https
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (deploy/setup-ec2.sh does this)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # certificates survive restarts (avoids Let's Encrypt rate limits)
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped

  frontend:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    environment:
      APP_ENV: staging                 # production refuses mock mode on purpose; this is a demo
      MOCK_MODE: "true"
      SWIGGY_CONNECT_ENABLED: "false"  # no one on the internet can connect a Swiggy account to this server
      ALLOW_REAL_ORDERS: "false"
      NLU_PROVIDER: rules
    restart: unless-stopped

  mock-mcp:
    ports: !reset []
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
