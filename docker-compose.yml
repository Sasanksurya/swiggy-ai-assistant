services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-swiggy_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiggy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-mcp:
    build: ./mock-mcp
    ports:
      - "8100:8100"

  backend:
    build: ./backend
    env_file:
      - .env.example
    environment:
      APP_ENV: development
      MOCK_MODE: ${MOCK_MODE:-true}
      MOCK_MCP_URL: http://mock-mcp:8100
      DATABASE_URL: postgresql://${POSTGRES_USER:-swiggy}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-swiggy_assistant}
      REDIS_URL: redis://redis:6379/0
      SESSION_STORE: redis
      NLU_PROVIDER: ${NLU_PROVIDER:-rules}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # LangSmith tracing: values come from your local .env (never committed)
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-swiggy-ai-assistant}
      # Real Swiggy (Builders Club). Only used when MOCK_MODE=false; tokens persist in the swiggy_data volume
      ALLOW_REAL_ORDERS: ${ALLOW_REAL_ORDERS:-false}
      SWIGGY_BASE_URL: ${SWIGGY_BASE_URL:-https://mcp.swiggy.com}
      SWIGGY_REDIRECT_URI: ${SWIGGY_REDIRECT_URI:-http://localhost:8000/api/swiggy/callback}
      SWIGGY_TOKEN_PATH: /data/swiggy_tokens.json
      SWIGGY_CONNECT_ENABLED: ${SWIGGY_CONNECT_ENABLED:-true}
    volumes:
      - swiggy_data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-mcp:
        condition: service_started

volumes:
  pgdata:
  swiggy_data:
